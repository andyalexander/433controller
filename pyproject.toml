[project]
name = "draytek-dsl"
version = "1.0.0"
description = "Home Assistant custom integration for DrayTek Vigor DSL speed monitoring"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
